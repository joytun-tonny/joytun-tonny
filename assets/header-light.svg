<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" rx="10" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="none" stroke="#D0D7DE"/>
  <text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#57606A">PROFILE · REV. 2026.10</text>
  <text x="860" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#57606A">cs.CL · cs.IR · cs.AI</text>
  <line x1="40" y1="52" x2="860" y2="52" stroke="#D0D7DE"/>
  <text x="450" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="34" fill="#1B1F24">Show Me the Evidence:</text>
  <text x="450" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="21" font-style="italic" fill="#1B1F24">Building Language Systems That Can Back Up What They Say</text>
  <text x="450" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#0E7C86">Joytun Nessa Tonny</text>
  <text x="450" y="201" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13" font-style="italic" fill="#57606A">Department of Data Science, United International University, Dhaka, Bangladesh</text>
  <rect x="80" y="224" width="740" height="140" rx="6" fill="#EEF7F8"/>
  <text x="450" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#1B1F24">ABSTRACT</text>
  <text x="110" y="266" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" fill="#1B1F24">Language models and recommender systems increasingly tell us what to read and</text><text x="110" y="287" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" fill="#1B1F24">what to believe. My work asks a simple question of them: can the claim be traced</text><text x="110" y="308" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" fill="#1B1F24">back to evidence? I build systems that ground recommendations in citation graphs,</text><text x="110" y="329" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" fill="#1B1F24">verify generated explanations, and test whether LLMs keep up as evidence changes.</text>
  <text x="110" y="354" font-family="Georgia, 'Times New Roman', Times, serif" font-size="12.5" fill="#57606A"><tspan font-style="italic" fill="#1B1F24">Keywords:</tspan> trustworthy NLP · claim verification · RAG · scholarly recommendation · hallucination</text>
</svg>